name: iOS + watchOS Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app and watch companion (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          test -d build/ios/iphoneos/Runner.app/Watch/HeatShieldWatch.app
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -y ../heatshield-ios-watch-unsigned.ipa Payload

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: heatshield-ios-watch-unsigned-ipa
          path: build/ios/heatshield-ios-watch-unsigned.ipa