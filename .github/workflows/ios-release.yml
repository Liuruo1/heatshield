name: iOS and Apple Watch Unsigned Build

on:
  push:
    branches: [ main ] # Runs every time you push to the main branch
  workflow_dispatch:   # Allows you to run it manually from the GitHub website

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # You can specify a flutter version here if needed, e.g., version: '3.19.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS and embedded watchOS app (No Signing)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          test -d build/ios/iphoneos/Runner.app/Watch/HeatShieldWatch.app
          test -d build/ios/iphoneos/Runner.app/Watch/HeatShieldWatch.app/PlugIns/HeatShieldWatchExtension.appex
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ios-app-unsigned.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ios-app-unsigned.ipa