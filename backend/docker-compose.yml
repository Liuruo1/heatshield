services:
  api:
    build: .
    container_name: heatshield-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: heatshield-db
    environment:
      POSTGRES_USER: heatshield
      POSTGRES_PASSWORD: heatshield
      POSTGRES_DB: heatshield
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatshield -d heatshield"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
